[package]
name = "cheatrs"
version = "0.1.0"
edition = "2024"
description = "A terminal browser for programming cheatsheets"
license = "MIT"

[dependencies]
ratatui = "0.30.2"
crossterm = "0.29"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
include_dir = "0.7"
syntect = "5.3"

[profile.release]
lto = true
codegen-units = 1
