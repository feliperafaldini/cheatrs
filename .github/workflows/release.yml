name: release

# Builds the static binary and attaches it to the release that triggered this.
# musl, not glibc: a gnu build only runs on distributions at least as new as the
# runner, and this project is meant to run on whatever Linux the reader has.
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to attach the binary to
        required: true

permissions:
  contents: write

jobs:
  linux-x86_64:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name || inputs.tag }}

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-musl

      - uses: Swatinem/rust-cache@v2
        with:
          key: musl

      - name: musl toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools
          # onig_sys (syntect) compiles C, so cc needs a musl-targeting compiler
          # and not just the Rust target.
          echo "CC_x86_64_unknown_linux_musl=musl-gcc" >> "$GITHUB_ENV"

      - name: Build
        run: cargo build --release --locked --target x86_64-unknown-linux-musl

      - name: Package
        run: |
          set -euo pipefail
          asset="cheatrs-linux-x86_64"
          cp "target/x86_64-unknown-linux-musl/release/cheatrs" "$asset"
          strip "$asset"
          sha256sum "$asset" > "$asset.sha256"
          file "$asset"
          cat "$asset.sha256"

      - name: Refuse a dynamic binary
        run: |
          set -euo pipefail
          if ldd cheatrs-linux-x86_64 2>&1 | grep -q "=> /"; then
            echo "::error::the binary links against system libraries, it is not static"
            exit 1
          fi
          ./cheatrs-linux-x86_64 --validate

      - name: Attach to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.event.release.tag_name || inputs.tag }}
        run: |
          gh release upload "$TAG" cheatrs-linux-x86_64 cheatrs-linux-x86_64.sha256 --clobber
